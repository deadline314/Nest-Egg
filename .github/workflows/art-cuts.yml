name: Offline character cuts

on:
  push:
    branches: [main]
    paths:
      - 'tools/comfyui/**'
      - 'art_src/characters/rin_hands/**'
      - 'art_src/characters/rin_worn_coat/**'
      - 'art_src/characters/rin_support_grip_22308/**'
      - 'art_src/characters/rin2/**'
      - '.github/workflows/art-cuts.yml'
  pull_request:
    paths:
      - 'tools/comfyui/**'
      - 'art_src/characters/rin_hands/**'
      - 'art_src/characters/rin_worn_coat/**'
      - 'art_src/characters/rin_support_grip_22308/**'
      - 'art_src/characters/rin2/**'
      - '.github/workflows/art-cuts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU image dependencies
        run: python -m pip install numpy Pillow scipy opencv-python-headless
      - name: Check source coverage, completion and existing cut contracts
        run: |
          python tools/comfyui/test_source_alpha.py
          python tools/comfyui/test_joint_caps.py
          python tools/comfyui/test_mask_delivery.py
          python tools/comfyui/test_point_mask_cache.py
          python tools/comfyui/test_point_mask_validation.py
          python tools/comfyui/test_cache_options.py
          python tools/comfyui/test_registered_layers.py
          python tools/comfyui/test_hand_attachments.py
          python tools/comfyui/test_final_overrides.py
