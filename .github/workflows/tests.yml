name: tests

# 完整測試放在 CI：每次推送到 main、每個 PR、以及每小時一次（只在程式有更動、距離上次成功的測試之後才真的跑）。
# 平常開發只跑有更動到的範圍：tools/run_tests_changed.sh。
on:
  push:
    branches: [main]
    paths-ignore:
      - "pm/**"
      - "design/**"
      - "assets_src/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "pm/**"
      - "design/**"
      - "assets_src/**"
      - "**/*.md"
  schedule:
    - cron: "17 * * * *"   # 每小時（錯開整點，避免和別人一起擠）
  workflow_dispatch:

# 同一個分支有新的推送就取消舊的執行。
concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name == 'schedule' && 'schedule' || 'change' }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2-stable"

jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      # 排程觸發時，如果這個提交已經有成功的測試，就不用再跑一次。
      - name: Skip when nothing changed since the last green run
        id: gate
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="$(gh run list --workflow tests.yml --branch "${GITHUB_REF_NAME}" --status success --limit 1 --json headSha --jq '.[0].headSha // ""')"
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Nothing changed since the last green run ($last)."
          fi

      # NE-280: retain audio, Wayland, accessibility and both renderers.
      # Save a verified engine before game tests so cancellation does not lose a build.
      - name: Restore the repaired Godot editor
        id: engine-cache
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: work/godot-audio-safe/dist
          key: godot-audio-linux-x86_64-ubuntu24-${{ hashFiles('tools/godot_audio/manifest.json', 'tools/godot_audio/*.patch', 'tools/godot_audio/build.py') }}

      - name: Install engine build dependencies
        if: steps.gate.outputs.skip != 'true' && steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-venv pkg-config libwayland-bin

      - name: Build or verify the repaired editor
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: 90
        run: |
          python3 tools/godot_audio/test_build.py
          python3 tools/test_select_tests.py
          python3 tools/test_dummy_texture_exit.py
          python3 tools/godot_audio/build.py --jobs 3 --github-env "$GITHUB_ENV"
          cat work/godot-audio-safe/dist/receipt.json

      - name: Cache the verified editor
        if: steps.gate.outputs.skip != 'true' && steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/godot-audio-safe/dist
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}

      # 匯入快取（貼圖、音訊）：內容沒變就沿用，省下幾分鐘。
      - name: Cache the import folder
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.import') }}
          restore-keys: godot-import-${{ env.GODOT_VERSION }}-

      - name: Import the project
        if: steps.gate.outputs.skip != 'true'
        run: |
          "$GODOT" --headless --editor --quit || true
          "$GODOT" --headless --editor --quit || true

      - name: Check independent single and concurrent texture allocations
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: 5
        run: python3 tools/run_texture_threads.py --godot "$GODOT" --output "${{ runner.temp }}/texture-workers"

      - name: Check actual positional audio mixing
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: 3
        run: |
          python3 tools/godot_audio/run_audio_load.py --engine "$GODOT" --output "${{ runner.temp }}/audio-load" --cases 8 --seconds 12

      - name: Check durable handoff NPC completion and cold read
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: 10
        run: |
          python3 tools/run_handoff_completion.py --godot "$GODOT" --output "${{ runner.temp }}/handoff-completion"

      - name: Check optional Sunday choice and cold continuation
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: 15
        run: |
          python3 tools/test_runtime_probe.py
          python3 tools/run_sunday_choice.py --godot "$GODOT" --output "${{ runner.temp }}/sunday-choice"

      - name: Check voice continuation and original pending-primary cold reads
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: 20
        run: |
          python3 tools/run_voice_completion.py --godot "$GODOT" --output "${{ runner.temp }}/voice-completion"

      - name: Check Ali results and original pending-primary cold reads
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: 20
        run: |
          python3 tools/run_ali_completion.py --godot "$GODOT" --output "${{ runner.temp }}/ali-completion"

      - name: Check original greeting source after authored NPC departure
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: 5
        run: |
          python3 tools/run_bubble_source.py --godot "$GODOT" --output "${{ runner.temp }}/bubble-source"

      - name: Check original reception results and pending-name cold reads
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: 20
        run: |
          python3 tools/run_reception_completion.py --godot "$GODOT" --output "${{ runner.temp }}/reception-completion"

      - name: Check original supper results and pending-primary cold reads
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: 20
        run: |
          python3 tools/run_supper_completion.py --godot "$GODOT" --output "${{ runner.temp }}/supper-completion"
          python3 tools/run_supper_repeat.py --godot "$GODOT" --output "${{ runner.temp }}/supper-repeat"

      - name: Check original greeting state after committed supper
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: 5
        run: python3 tools/run_bubble_state.py --godot "$GODOT" --output "${{ runner.temp }}/bubble-state"

      - name: Check first-clinic results and original pending cold reads
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: 30
        run: python3 tools/run_clinic_completion.py --godot "$GODOT" --output "${{ runner.temp }}/clinic-completion"

      - name: Run all tests (parallel)
        timeout-minutes: 45
        if: steps.gate.outputs.skip != 'true'
        env:
          LOG_DIR: ${{ runner.temp }}/test-logs
        run: |
          mkdir -p "$LOG_DIR"
          tools/run_tests_parallel.sh

      - name: Reject DummyTexture exit leaks in complete game logs
        if: steps.gate.outputs.skip != 'true'
        run: python3 tools/check_dummy_texture_exit.py "${{ runner.temp }}/test-logs"

      - name: Upload the test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            ${{ runner.temp }}/texture-workers/**/*.log
            ${{ runner.temp }}/texture-workers/**/*.json
            ${{ runner.temp }}/test-logs/*.log
            ${{ runner.temp }}/audio-load/*.log
            ${{ runner.temp }}/audio-load/*.json
            ${{ runner.temp }}/handoff-completion/**/*.log
            ${{ runner.temp }}/handoff-completion/**/*.json
            ${{ runner.temp }}/sunday-choice/**/*.log
            ${{ runner.temp }}/sunday-choice/**/*.json
            ${{ runner.temp }}/voice-completion/**/*.log
            ${{ runner.temp }}/voice-completion/**/*.json
            ${{ runner.temp }}/ali-completion/**/*.log
            ${{ runner.temp }}/ali-completion/**/*.json
            ${{ runner.temp }}/bubble-source/**/*.log
            ${{ runner.temp }}/bubble-source/**/*.json
            ${{ runner.temp }}/bubble-state/**/*.log
            ${{ runner.temp }}/bubble-state/**/*.json
            ${{ runner.temp }}/reception-completion/**/*.log
            ${{ runner.temp }}/reception-completion/**/*.json
            ${{ runner.temp }}/supper-completion/**/*.log
            ${{ runner.temp }}/supper-completion/**/*.json
            ${{ runner.temp }}/supper-repeat/**/*.log
            ${{ runner.temp }}/supper-repeat/**/*.json
            work/godot-audio-safe/dist/receipt.json
          retention-days: 7
